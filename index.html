<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141214" id="themeColor">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Suivi ALB">
<title>Suivi ALB</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
/* ---------- Palette : noir, or rose, blanc légèrement teinté ---------- */
:root{
  --bg:#faf6f4; --bg2:#f3ebe8; --card:#ffffff; --ink:#141214; --ink2:#5d5459; --line:#e8dcd8;
  --rose:#b76e79; --rose-d:#8e4a56; --rose-l:#e9c9c3; --rose-soft:#f6e6e3;
  --gold-grad:linear-gradient(120deg,#8e4a56 0%,#c98f8f 45%,#ecc9bc 72%,#b76e79 100%);
  --ok:#2f6b4a; --ok-bg:#e3f0e8; --warn:#8a5a14; --warn-bg:#f6ecd8; --bad:#a1313a; --bad-bg:#f7e1e2; --info:#3b4f86; --info-bg:#e6eaf6;
  --shadow:0 12px 30px -16px rgba(40,18,24,.28); --radius:14px; --field:#fff; --overlay:rgba(20,18,20,.5);
  --serif:"Newsreader","Times New Roman",Times,Georgia,serif; --display:"Cormorant Garamond","Times New Roman",Times,Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#100e10; --bg2:#171416; --card:#1c181b; --ink:#f5eeeb; --ink2:#b8abae; --line:#30292d;
    --rose:#d99aa3; --rose-d:#e9b7bd; --rose-l:#5a3a41; --rose-soft:#2a1f23;
    --ok:#7fcf9f; --ok-bg:#1c2e24; --warn:#e3bb78; --warn-bg:#2e2616; --bad:#f09aa1; --bad-bg:#341d20; --info:#a9b9ee; --info-bg:#1d2236;
    --shadow:0 14px 34px -18px rgba(0,0,0,.8); --field:#231e21; --overlay:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --bg:#100e10; --bg2:#171416; --card:#1c181b; --ink:#f5eeeb; --ink2:#b8abae; --line:#30292d;
  --rose:#d99aa3; --rose-d:#e9b7bd; --rose-l:#5a3a41; --rose-soft:#2a1f23;
  --ok:#7fcf9f; --ok-bg:#1c2e24; --warn:#e3bb78; --warn-bg:#2e2616; --bad:#f09aa1; --bad-bg:#341d20; --info:#a9b9ee; --info-bg:#1d2236;
  --shadow:0 14px 34px -18px rgba(0,0,0,.8); --field:#231e21; --overlay:rgba(0,0,0,.65);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0}
a{color:var(--rose-d)}
button,a,select,label.btn,[data-act],.chips button,.fab,nav.bottom button,aside.side nav button,input[type=checkbox]{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.6}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

/* ---------- Écran de démarrage ---------- */
#splash{position:fixed;inset:0;z-index:200;background:#141214;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s ease,visibility .45s}
#splash.off{opacity:0;visibility:hidden}
#splash img{width:112px;height:112px;border-radius:50%;animation:splashIn .9s cubic-bezier(.2,.8,.2,1) both}
#splash .name{font-family:var(--display);font-size:30px;color:#f5eeeb;letter-spacing:.14em;animation:fadeUp .8s .25s both}
#splash .rule{height:1px;width:0;background:var(--gold-grad);animation:rule 1s .35s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes splashIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rule{to{width:150px}}

/* ---------- Connexion ---------- */
#login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:6px;background:radial-gradient(120% 70% at 50% 0%,var(--rose-soft),var(--bg) 62%)}
#login .logo{width:96px;height:96px;border-radius:50%;box-shadow:0 14px 30px -12px rgba(40,18,24,.5)}
#login h1{font-size:34px;margin-top:10px}
#login p.sub{margin:0 0 14px;color:var(--ink2)}
#login form{width:100%;max-width:340px}
.pw{position:relative}
.pw input{padding-right:48px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:none;color:var(--ink2);display:flex;align-items:center;justify-content:center;border-radius:50%;transition:color .2s,background .2s}
.eye:hover{background:var(--bg2)}
.eye.on{color:var(--rose-d)}
.eye svg{width:24px;height:24px;overflow:visible}
.eye .shape{transform-origin:12px 12px}
.eye .pupil{transform-origin:12px 12px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.eye:not(.on) .pupil{transform:scale(.35)}
.eye .slash{stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset .38s cubic-bezier(.6,0,.2,1)}
.eye.on .slash{stroke-dashoffset:1}
.eye.blink .shape{animation:blink .32s ease}
@keyframes blink{50%{transform:scaleY(.15)}}

/* ---------- Structure ---------- */
#app{min-height:100vh;display:flex}
aside.side{display:none}
.shell-main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:#141214;color:#f5eeeb;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 12px;border-bottom:1px solid transparent;border-image:var(--gold-grad) 1}
header.top .lg{width:36px;height:36px;border-radius:50%;background:#fff;padding:2px;flex-shrink:0}
header.top h1{font-size:23px;flex:1;letter-spacing:.02em}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:transparent;color:#f5eeeb;display:flex;align-items:center;justify-content:center;transition:background .15s}
.icon-btn:active{background:rgba(255,255,255,.18)}
.icon-btn svg,nav svg,aside svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:980px;margin:0 auto;width:100%}
.shell-main header.top-desk{display:none}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom button{flex:1;background:none;border:0;padding:9px 2px 8px;font-size:12px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;font-family:var(--serif)}
nav.bottom button.on{color:var(--rose-d);font-weight:600}
nav.bottom button.on::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:28px;height:2px;background:var(--gold-grad)}

/* ---------- Cartes et textes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.tap{cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
h2{font-size:23px;margin:22px 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--ink2);font-size:14.5px}
.late{color:var(--bad);font-weight:600}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold-grad)}
.kpi b{display:block;font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1}
.kpi small{color:var(--ink2);font-size:14px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px}
.trio>div{padding:14px 10px;text-align:center;border-left:1px solid var(--line)}
.trio>div:first-child{border-left:0}
.trio b{display:block;font-family:var(--display);font-size:23px;font-weight:700;line-height:1.1;white-space:nowrap}
.trio em{display:block;font-style:normal;font-size:12px;color:var(--ink2);letter-spacing:.06em;margin-top:1px}
.trio small{color:var(--ink2);font-size:13px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:500;white-space:nowrap}
.k-grey{background:var(--bg2);color:var(--ink2)}.k-ok{background:var(--ok-bg);color:var(--ok)}.k-warn{background:var(--warn-bg);color:var(--warn)}.k-bad{background:var(--bad-bg);color:var(--bad)}.k-info{background:var(--info-bg);color:var(--info)}.k-rose{background:var(--rose-soft);color:var(--rose-d)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--gold-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;flex-shrink:0;text-shadow:0 1px 2px rgba(60,20,30,.4)}
.day{font-family:var(--display);font-size:19px;color:var(--rose-d);margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:18px;text-align:center;color:var(--ink2);margin-bottom:12px}

/* ---------- Boutons et champs ---------- */
.btn{border:0;border-radius:10px;padding:10px 16px;background:#141214;color:#fff;font-weight:600;transition:transform .12s ease}
:root[data-theme="dark"] .btn:not(.alt):not(.grey):not(.danger){background:var(--rose);color:#190f12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.alt):not(.grey):not(.danger){background:var(--rose);color:#190f12}}
.btn:active{transform:scale(.96)}
.btn.alt{background:transparent;color:var(--rose-d);border:1px solid var(--rose)}
.btn.grey{background:var(--bg2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:7px 12px;font-size:14.5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:16px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px color-mix(in srgb,var(--rose) 25%,transparent)}
textarea{min-height:80px}
select.mini{width:auto;padding:5px 8px;font-size:14.5px;border-radius:8px}
label{display:block;font-size:14px;color:var(--ink2);margin:12px 0 4px;font-weight:500}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:14.5px;transition:all .15s}
.chips button.on{background:#141214;border-color:#141214;color:#fff}
:root[data-theme="dark"] .chips button.on{background:var(--rose);border-color:var(--rose);color:#190f12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chips button.on{background:var(--rose);border-color:var(--rose);color:#190f12}}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:19;width:56px;height:56px;border-radius:50%;border:0;background:var(--gold-grad);color:#fff;box-shadow:0 12px 26px -8px rgba(142,74,86,.65);display:flex;align-items:center;justify-content:center;transition:transform .2s}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.fab:active{transform:scale(.92) rotate(90deg)}

/* ---------- Fenêtre (sheet) ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{background:var(--card);width:100%;max-width:720px;max-height:94vh;max-height:94dvh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:slideUp .24s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(26px);opacity:.6}to{transform:none;opacity:1}}
.panel h3{font-size:26px;margin-bottom:2px}
.line{display:grid;grid-template-columns:1fr 56px 104px 38px;gap:6px;margin-bottom:6px;align-items:center}
.tot{background:var(--bg2);border-radius:12px;padding:12px;margin-top:10px;border:1px solid var(--line)}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .big{font-weight:600;font-family:var(--display);font-size:21px;color:var(--rose-d)}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 4px;text-align:left;font-size:17px}
.menu-item svg{width:22px;height:22px;fill:none;stroke:var(--rose-d);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#141214;color:#fff;padding:11px 18px;border-radius:11px;z-index:99;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);border:1px solid #3a3034;animation:fade .2s ease}
canvas#pad{border:1.5px dashed var(--rose);border-radius:12px;width:100%;height:150px;touch-action:none;background:#fff}
.sigimg{max-height:70px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
.banner{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:15px}

/* ---------- Graphique ---------- */
.bars{display:flex;gap:6px;align-items:flex-end;height:130px;padding-top:6px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars i{display:block;width:100%;max-width:28px;border-radius:5px 5px 0 0;background:var(--gold-grad);min-height:2px;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.bars span{font-size:11.5px;color:var(--ink2);margin-top:5px;white-space:nowrap}

/* ---------- Progression de téléchargement ---------- */
#dlProgress{position:fixed;inset:0;z-index:120;background:var(--overlay);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .22s ease}
#dlProgress.on{opacity:1}
#dlProgress .dlp-box{background:var(--card);border-radius:16px;padding:26px 30px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.4);min-width:190px;border:1px solid var(--line)}
#dlProgress .dlp-ring{position:relative;width:76px;height:76px}
#dlProgress svg{width:76px;height:76px;transform:rotate(-90deg);position:absolute;top:0;left:0}
#dlProgress .dlp-bg{fill:none;stroke:var(--line);stroke-width:6}
#dlProgress .dlp-bar{fill:none;stroke:var(--rose);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .1s linear}
#dlProgress b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:19px;line-height:1}
#dlProgress span{font-size:14px;color:var(--ink2);text-align:center;max-width:180px}

/* ---------- Ordinateur ---------- */
@media (min-width:900px){
  aside.side{display:flex;flex-direction:column;width:244px;flex-shrink:0;background:#141214;color:#f5eeeb;min-height:100vh;position:sticky;top:0;padding:24px 16px;height:100vh}
  aside.side .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  aside.side .brand img{width:42px;height:42px;border-radius:50%;background:#fff;padding:2px}
  aside.side .brand b{font-family:var(--display);font-size:23px;font-weight:600;letter-spacing:.04em}
  aside.side nav{display:flex;flex-direction:column;gap:2px}
  aside.side nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:rgba(245,238,235,.78);padding:11px 12px;border-radius:10px;font-size:16.5px;text-align:left;transition:background .15s}
  aside.side nav button:hover{background:rgba(255,255,255,.07)}
  aside.side nav button.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--rose)}
  aside.side .foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:14px;opacity:.85;word-break:break-all}
  nav.bottom,header.top{display:none}
  .shell-main header.top-desk{display:flex;position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);align-items:center;gap:12px;padding:16px 30px}
  .shell-main header.top-desk h1{font-size:30px}
  main{padding:24px 30px 40px;max-width:1100px}
  .fab{right:32px;bottom:32px}
  .sheet{align-items:center}
  .panel{border-radius:18px;max-width:660px;max-height:88vh}
  #toast{bottom:32px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="splash"><img data-logo alt=""><div class="name" data-brand>ALB</div><div class="rule"></div></div>

<div id="login" hidden>
  <img class="logo" data-logo alt="">
  <h1 data-brand>ALB</h1>
  <p class="sub">Votre espace de suivi</p>
  <form id="loginForm">
    <label for="lemail">E-mail</label>
    <input id="lemail" type="email" autocomplete="username" autocapitalize="none" required>
    <label for="lpass">Mot de passe</label>
    <div class="pw">
      <input id="lpass" type="password" autocomplete="current-password" required>
      <button type="button" class="eye" id="eyeBtn" aria-label="Afficher le mot de passe" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path class="shape" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
          <circle class="pupil" cx="12" cy="12" r="3"/>
          <path class="slash" d="M4 4L20 20" pathLength="1"/>
        </svg>
      </button>
    </div>
    <p style="margin:16px 0 6px"><button class="btn" style="width:100%">Se connecter</button></p>
    <p class="muted" id="lerr" style="color:var(--bad);text-align:center;min-height:1.4em;margin:6px 0"></p>
    <p style="text-align:center;margin:0"><a href="#" id="forgot" class="muted">Mot de passe oublié</a></p>
  </form>
</div>

<div id="app" hidden>
  <aside class="side">
    <div class="brand"><img data-logo alt=""><b data-brand>ALB</b></div>
    <nav id="sideNav"></nav>
    <div class="foot" id="sideFoot"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn sm grey" data-act="theme" style="flex:1">Thème</button>
      <button class="btn sm grey" data-act="logout" style="flex:1">Quitter</button>
    </div>
  </aside>
  <div class="shell-main">
    <header class="top">
      <img class="lg" data-logo alt="">
      <h1 id="title">Tableau de bord</h1>
      <button class="icon-btn" data-act="theme" aria-label="Changer de thème" id="themeBtn"></button>
      <button class="icon-btn" data-act="menu" aria-label="Menu"></button>
    </header>
    <header class="top-desk"><h1 id="titleDesk">Tableau de bord</h1></header>
    <main id="view"></main>
  </div>
  <nav class="bottom" id="bottomNav"></nav>
</div>
<div id="sheet" class="sheet" hidden><div class="panel" id="panel"></div></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, getDocs, runTransaction, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC1DYc7sYfEXCXL2Q_NQvhcAGarQVNvwoo",

// ---------- nombre en lettres ----------
function enLettres(n) {
  n = Math.round(n);
  if (n === 0) return "zéro";
  const u = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  const t = ["","","vingt","trente","quarante","cinquante","soixante"];
  const b100 = (n, last) => {
    if (n < 20) return u[n];
    if (n < 70) { const d = Math.floor(n / 10), r = n % 10; return t[d] + (r === 1 ? " et un" : r ? "-" + u[r] : ""); }
    if (n < 80) { const r = n - 60; return "soixante" + (r === 11 ? " et onze" : "-" + u[r]); }
    if (n === 80) return last ? "quatre-vingts" : "quatre-vingt";
    return "quatre-vingt-" + u[n - 80];
  };
  const b1000 = (n, last) => {
    if (n < 100) return b100(n, last);
    const c = Math.floor(n / 100), r = n % 100;
    const s = c === 1 ? "cent" : u[c] + " cent" + (r === 0 && last ? "s" : "");
    return r === 0 ? s : s + " " + b100(r, last);
  };
  const parts = []; const mds = Math.floor(n / 1e9), mil = Math.floor((n % 1e9) / 1e6), k = Math.floor((n % 1e6) / 1e3), r = n % 1e3;
  if (mds) parts.push(b1000(mds, false) + " milliard" + (mds > 1 ? "s" : ""));
  if (mil) parts.push(b1000(mil, false) + " million" + (mil > 1 ? "s" : ""));
  if (k) parts.push(k === 1 ? "mille" : b1000(k, false) + " mille");
  if (r) parts.push(b1000(r, true));
  return parts.join(" ");
}

  } catch (e) {}
}

function totals(d) {

}

function readDocFields() {

function refreshTot() {
  if (!$("#tot")) return; readDocFields(); const t = totals(edit);
  $("#tot").innerHTML = `<div><span>Sous-total</span><span>${money(t.sub)}</span></div>${t.remise ? `<div><span>Remise</span><span>- ${money(t.remise)}</span></div>` : ""}${edit.tvaOn ? `<div><span>TVA ${edit.tvaTaux} %</span><span>${money(t.tva)}</span></div>` : ""}<div class="big"><span>Total</span><span>${money(t.total)}</span></div>${edit.type === "Proforma" ? `<div><span>Acompte ${edit.acomptePct} %</span><span>${money(t.acompte)}</span></div>` : ""}`;

async function nextNumber(prefix, yr) {
  const cref = doc(db, "counters", prefix + "-" + yr);
  const n = await runTransaction(db, async tx => { const s = await tx.get(cref); const v = (s.exists() ? s.data().n : 0) + 1; tx.set(cref, { n: v }); return v; });
  return `${prefix}-${yr}-${String(n).padStart(3, "0")}`;
}
async function saveDoc(thenPdf) {
  readDocFields();
  if (!edit.clientNom) return toast("Indiquez le nom du client.");
  if (!edit.lignes.some(l => l.d && num(l.pu))) return toast("Ajoutez au moins une prestation avec un prix.");
  const d = { ...edit }, id = d.id; delete d.id; const sourceId = d._sourceId; delete d._sourceId;
  try {
    if (!id) {
      d.numero = await nextNumber(d.type === "Devis" ? "DEV" : "PRO", d.date.slice(0, 4)); d.createdAt = Date.now();
      const ref = await addDoc(collection(db, "documents"), d); d.id = ref.id;
      if (sourceId) await updateDoc(doc(db, "documents", sourceId), { supersededBy: d.id });
    } else { await setDoc(doc(db, "documents", id), d); d.id = id; }
    closeSheet(); toast("Document enregistré : " + d.numero);
    if (thenPdf) makePdf(d);
  } catch (e) { toast("Échec : " + e.code + " (vérifiez la connexion)"); }
}
async function setDocStatut(id, statut) { try { await updateDoc(doc(db, "documents", id), { statut }); } catch (e) { toast("Échec : " + e.code); } }

function payCard(d) {
  const reste = resteOf(d), late = payLate(d), nb = (d.relances || []).length;
  return `<div class="card"><div class="row" style="flex-wrap:nowrap"><div style="flex:1;min-width:0"><b style="font-size:17px">${esc(d.clientNom)}</b><div class="muted">${esc(d.numero)}${d.objet ? " · " + esc(d.objet) : ""}</div></div>${late ? badge("En retard", "bad") : ""}</div>
  <div class="row" style="margin:8px 0 0"><span class="muted">Total ${money(totals(d).total)} · reçu ${money(paidOf(d))}</span><span class="sp"></span><b style="font-family:var(--display);font-size:21px">${money(reste)}</b></div>
  <div class="muted">${d.echeance ? `Échéance : <span class="${late ? "late" : ""}">${fdate(d.echeance)}</span>` : "Pas d'échéance"}${nb ? ` · relancé ${nb} fois (dernière le ${fdate(d.relances[nb - 1])})` : ""}</div>
  <div class="row" style="margin-top:10px"><button class="btn sm" data-act="newRecu" data-id="${d.id}">Encaisser</button><button class="btn sm alt" data-act="relancer" data-id="${d.id}">Relancer</button><button class="btn sm grey" data-act="editDoc" data-id="${d.id}">Échéance</button></div></div>`;

function viewPaiements() {

    <label>Téléphone / WhatsApp</label><input id="s_tel" value="${esc(s.tel)}" placeholder="+237 6XX XXX XXX">
    <label>E-mail</label><input id="s_email" value="${esc(s.email)}">
    <label>Site web / réseaux</label><input id="s_web" value="${esc(s.web)}">
    <label>NIU</label><input id="s_niu" value="${esc(s.niu)}">
    <label>Régime fiscal</label><input id="s_regime" value="${esc(s.regime)}" placeholder="Impôt libératoire / Réel">
    <label>Moyens de paiement</label><textarea id="s_pay" placeholder="Orange Money : … / MTN MoMo : … / Banque : …">${esc(s.pay)}</textarea>
    <label>Conditions par défaut (proforma)</label><textarea id="s_cond" style="min-height:130px">${esc(s.cond ?? DEFAULT_COND)}</textarea>
    <label>Taux de TVA par défaut (%)</label><input id="s_tva" inputmode="decimal" value="${esc(s.tvaTaux ?? 19.25)}"></div>
  <div class="card"><b style="font-size:18px">Mes packs</b><p class="muted" style="margin:4px 0 0">Le prix est repris automatiquement dans les devis.</p>
    ${packs().map((p, i) => `<div class="grid"><div><label>Pack ${i + 1}</label><input id="pk_n${i}" value="${esc(p.nom)}"></div><div><label>Prix (FCFA)</label><input id="pk_p${i}" inputmode="numeric" value="${esc(p.prix)}"></div></div>`).join("")}
    <p><button class="btn" data-act="saveSettings">Enregistrer</button></p></div>
  <div class="card"><b style="font-size:18px">Logo</b><p class="muted">Importez votre logo (PNG à fond transparent de préférence). Il apparaît dans l'application et sur les PDF.</p>
    <img src="${LOGO}" alt="" style="width:72px;height:72px;border-radius:50%;background:#fff;border:1px solid var(--line);padding:3px;display:block">
    <div class="row" style="margin-top:8px"><label class="btn sm alt" style="margin:0">Importer un logo<input type="file" accept="image/*" id="logoFile" hidden></label>${s.logo ? `<button class="btn sm grey" data-act="logoReset">Revenir au logo provisoire</button>` : ""}</div></div>
  <div class="card"><b style="font-size:18px">Ma signature</b><p class="muted">Dessinez-la au doigt : elle sera ajoutée sur vos PDF.</p>
    ${s.signature ? `<img class="sigimg" src="${s.signature}" alt="Signature enregistrée">` : `<p class="muted">Aucune signature enregistrée.</p>`}
    <canvas id="pad" width="600" height="300"></canvas>
    <div class="row" style="margin-top:8px"><button class="btn sm" data-act="sigSave">Enregistrer la signature</button><button class="btn sm grey" data-act="sigClear">Effacer</button><label class="btn sm alt" style="margin:0">Importer une image<input type="file" accept="image/*" id="sigFile" hidden></label></div></div>
  <div class="card"><b style="font-size:18px">Données</b><p class="muted">Vos données sont enregistrées automatiquement. Vous pouvez aussi en garder une copie.</p>
    <div class="row"><button class="btn sm" data-act="exportXlsx">Exporter en Excel</button><button class="btn sm grey" data-act="backup">Sauvegarde complète (JSON)</button><label class="btn sm alt" style="margin:0">Restaurer une sauvegarde<input type="file" accept=".json" id="jsonFile" hidden></label></div>
    <p class="muted">Connecté : ${esc(user?.email)}</p><p><button class="btn sm grey" data-act="logout">Se déconnecter</button></p></div>`;
}
async function saveSettings() {
  const pk = packs().map((_, i) => ({ nom: $("#pk_n" + i).value.trim(), prix: $("#pk_p" + i).value.trim() })).filter(p => p.nom);
  const s = { ...settings, brand: $("#s_brand").value.trim() || "ALB", titulaire: $("#s_titulaire").value.trim(), tagline: $("#s_tagline").value.trim(), ville: $("#s_ville").value.trim(), tel: $("#s_tel").value.trim(), email: $("#s_email").value.trim(), web: $("#s_web").value.trim(),
    niu: $("#s_niu").value.trim(), regime: $("#s_regime").value.trim(), pay: $("#s_pay").value.trim(), cond: $("#s_cond").value, tvaTaux: num($("#s_tva").value) || 19.25, packs: pk };
  try { await setDoc(doc(db, "settings", "main"), s); toast("Réglages enregistrés."); } catch (e) { toast("Échec : " + e.code); }
}
let drawing = false, pad, pctx, hasInk = false;
function initPad() {
  pad = $("#pad"); if (!pad) return; pctx = pad.getContext("2d"); pctx.lineWidth = 4; pctx.lineCap = "round"; pctx.lineJoin = "round"; pctx.strokeStyle = "#141214"; hasInk = false;
  const pos = e => { const r = pad.getBoundingClientRect(), t = e.touches ? e.touches[0] : e; return [(t.clientX - r.left) * pad.width / r.width, (t.clientY - r.top) * pad.height / r.height]; };
  const st = e => { drawing = true; const [x, y] = pos(e); pctx.beginPath(); pctx.moveTo(x, y); e.preventDefault(); };
  const mv = e => { if (!drawing) return; const [x, y] = pos(e); pctx.lineTo(x, y); pctx.stroke(); hasInk = true; e.preventDefault(); };
  const en = () => drawing = false;
  pad.onmousedown = st; pad.onmousemove = mv; window.onmouseup = en; pad.addEventListener("touchstart", st, { passive: false }); pad.addEventListener("touchmove", mv, { passive: false }); pad.ontouchend = en;
}
async function saveSignature(dataUrl, w, h) { await setDoc(doc(db, "settings", "main"), { ...settings, signature: dataUrl, sigW: w, sigH: h }); toast("Signature enregistrée."); }
function resizeImage(file, max, cb) { const img = new Image(); img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * r), h = Math.round(img.height * r), c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h); cb(c.toDataURL("image/png"), w, h); }; img.src = URL.createObjectURL(file); }

// ---------- Excel / sauvegarde ----------
function exportXlsx() {
  const wb = XLSX.utils.book_new(), add = (rows, n) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), n);
  add(clients.map(c => ({ Nom: c.nom, Entreprise: c.entreprise, Telephone: c.tel, Email: c.email, Pack: c.pack, "Date de début": c.dateDebut, Statut: c.statut, Notes: c.notes })), "Clients");
  add(livrables.map(l => ({ Livrable: l.titre, Client: clientName(l.clientId), Statut: l.statut, "Date limite": l.dateLimite, Notes: l.notes })), "Livrables");
  add(posts.map(p => ({ Sujet: p.sujet, Plateforme: p.plateforme, Date: p.date, Heure: p.heure, Statut: p.statut, Client: clientName(p.clientId) })), "Editorial");
  add(docs.map(d => { const t = totals(d); return { Numero: d.numero, Type: d.type, Date: d.date, Client: d.clientNom, Objet: d.objet, "Total (FCFA)": t.total, "Reçu (FCFA)": paidOf(d), "Reste (FCFA)": resteOf(d), Echeance: d.echeance, Statut: d.statut }; }), "Documents");
  add(docs.flatMap(d => (d.paiements || []).map(p => ({ Recu: p.numero, Date: p.date, Client: d.clientNom, Document: d.numero, Montant: p.montant, Mode: p.mode, Nature: p.nature }))), "Paiements");
  XLSX.writeFile(wb, `Suivi_${brand()}_${today()}.xlsx`); localStorage.setItem("lastBackup", Date.now());
}
async function backup() {
  const counters = (await getDocs(collection(db, "counters"))).docs.map(d => ({ id: d.id, ...d.data() }));
  const blob = new Blob([JSON.stringify({ version: 1, date: new Date().toISOString(), clients, livrables, posts, documents: docs, settings, counters })], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `Suivi_${brand()}_sauvegarde_${today()}.json`; a.click(); localStorage.setItem("lastBackup", Date.now()); toast("Sauvegarde téléchargée.");
}
async function restore(file) {
  if (!confirm("Restaurer cette sauvegarde ? Les éléments de même identifiant seront remplacés.")) return;
  const j = JSON.parse(await file.text()), ops = [];
  [["clients", j.clients], ["livrables", j.livrables], ["posts", j.posts], ["documents", j.documents], ["counters", j.counters]].forEach(([col, arr]) => (arr || []).forEach(x => { const { id, ...r } = x; ops.push([col, id, r]); }));
  if (j.settings) ops.push(["settings", "main", j.settings]);
  for (let i = 0; i < ops.length; i += 400) { const b = writeBatch(db); ops.slice(i, i + 400).forEach(([c, id, r]) => b.set(doc(db, c, id), r)); await b.commit(); }
  toast("Sauvegarde restaurée.");
}

// ---------- fenêtre et événements ----------
const openSheet = html => { $("#panel").innerHTML = html; $("#sheet").hidden = false; $("#panel").scrollTop = 0; };
const closeSheet = () => { $("#sheet").hidden = true; edit = null; };
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
const del = (col, id, what) => async () => { if (confirm(`Supprimer ${what} ? Cette action est définitive.`)) { try { await deleteDoc(doc(db, col, id)); closeSheet(); toast("Supprimé."); } catch (e) { toast("Échec : " + e.code); } } };
const acts = {
  nav: d => { route = d.r; search = ""; closeSheet(); render(); scrollTo(0, 0); },
  menu: () => openSheet(`<h3>Menu</h3>${[["paiements", "Paiements", "wallet"], ["settings", "Réglages", "sliders"]].map(([r, l, i]) => `<button class="menu-item" data-act="nav" data-r="${r}">${ico(i)}${l}</button>`).join("")}<button class="menu-item" data-act="logout">${ico("out")}Se déconnecter</button>`),
  theme: cycleTheme, setTheme: d => { localStorage.setItem("theme", d.t); applyTheme(); render(); },
  logout: () => { closeSheet(); signOut(auth); },
  period: d => { periode = d.p; localStorage.setItem("periode", periode); render(); },
  fClient: d => { fClient = d.s; render(); }, fLiv: d => { fLiv = d.s; render(); }, fPost: d => { fPost = d.s; render(); }, fDoc: d => { fDoc = d.s; render(); },
  newClient: () => clientForm({ statut: "Prospect", dateDebut: today() }), viewClient: d => clientDetail(d.id), editClient: d => clientForm(clientById(d.id)), saveClient, closeSheet,
  delClient: () => del("clients", edit.id, "ce client")(),
  newLiv: () => livForm({ statut: "À produire" }), newLivFor: d => livForm({ statut: "À produire", clientId: d.id }), editLiv: d => livForm(livrables.find(l => l.id === d.id)), saveLiv, delLiv: () => del("livrables", edit.id, "ce livrable")(),
  newPost: () => postForm({ plateforme: "Facebook", statut: "À produire", date: today() }), editPost: d => postForm(posts.find(p => p.id === d.id)), savePost, delPost: () => del("posts", edit.id, "cette publication")(),
  newDocBlank: () => newDocFrom(""), newDoc: d => newDocFrom(d.id), editDoc: d => docForm(docs.find(x => x.id === d.id)),
  addLine: () => { readDocFields(); edit.lignes.push({ d: "", q: 1, pu: "" }); drawLines(); },
  delLine: d => { edit.lignes.splice(+d.i, 1); if (!edit.lignes.length) edit.lignes.push({ d: "", q: 1, pu: "" }); drawLines(); refreshTot(); },
  saveDoc: () => saveDoc(false), saveDocPdf: () => saveDoc(true),
  delDoc: d => { const x = docs.find(k => k.id === d.id); del("documents", d.id, "le document " + (x ? x.numero : ""))(); },
  pdf: d => makePdf(docs.find(x => x.id === d.id), d.mode), facture: d => makeFacture(docs.find(x => x.id === d.id), d.mode),
  toProforma: d => { const s = docs.find(x => x.id === d.id); const { id, numero, createdAt, supersededBy, ...r } = s; docForm({ ...r, type: "Proforma", statut: "Brouillon", date: today(), acomptePct: s.acomptePct || 50, cond: s.cond || settings.cond || DEFAULT_COND, paiements: s.paiements || [], _sourceId: s.id }); },
  newRecu: d => recuForm(d.id), saveRecu, solder: d => solderDoc(d.id), paiements: d => paiementsForm(d.id), delPaiement: d => delPaiement(edit.docId, d.i), relancer: d => relancer(d.id),
  saveSettings, sigClear: () => { pctx.clearRect(0, 0, pad.width, pad.height); hasInk = false; },
  sigSave: async () => { if (!hasInk) return toast("Dessinez d'abord votre signature."); try { await saveSignature(pad.toDataURL("image/png"), pad.width, pad.height); } catch (e) { toast("Échec : " + e.code); } },
  logoReset: async () => { try { const { logo, ...r } = settings; await setDoc(doc(db, "settings", "main"), r); toast("Logo provisoire rétabli."); } catch (e) { toast("Échec : " + e.code); } },
  exportXlsx, backup
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el && acts[el.dataset.act]) { if (el.tagName === "A") e.preventDefault(); acts[el.dataset.act](el.dataset, el); } });
document.addEventListener("change", async e => {
  const t = e.target;
  const quick = { livStatut: ["livrables", "Livrable"], postStatut: ["posts", "Publication"] }[t.dataset.change];
  if (quick) { try { await updateDoc(doc(db, quick[0], t.dataset.id), { statut: t.value }); toast(quick[1] + " : " + t.value); } catch (er) { toast("Échec : " + er.code); } }
  if (t.dataset.change === "docStatut") setDocStatut(t.dataset.id, t.value);
  if (t.id === "d_contact") { const c = clientById(t.value); if (c) { $("#d_nom").value = c.nom || ""; $("#d_ent").value = c.entreprise || ""; $("#d_tel").value = c.tel || ""; } }
  if (t.id === "d_type") { readDocFields(); if (edit.type === "Proforma" && !edit.cond) edit.cond = settings.cond ?? DEFAULT_COND; docForm(edit); }
  else if (["d_date", "d_remise", "d_acompte", "d_valid", "d_tvat", "d_tvaon"].includes(t.id)) refreshTot();
  if (t.id === "sigFile" && t.files[0]) resizeImage(t.files[0], 500, async (u, w, h) => { try { await saveSignature(u, w, h); } catch (er) { toast("Échec : " + er.code); } });
  if (t.id === "logoFile" && t.files[0]) resizeImage(t.files[0], 400, async u => { try { await setDoc(doc(db, "settings", "main"), { ...settings, logo: u }); toast("Logo enregistré."); } catch (er) { toast("Échec : " + er.code); } });
  if (t.id === "jsonFile" && t.files[0]) { try { await restore(t.files[0]); } catch (er) { toast("Restauration impossible : " + er.message); } t.value = ""; }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.bind === "search") { search = t.value; render(); }
  if (t.dataset.line !== undefined && edit) { edit.lignes[+t.dataset.line][t.dataset.f] = t.value; refreshTot(); }
  if (["d_remise", "d_acompte", "d_tvat"].includes(t.id)) refreshTot();
});
</script>
